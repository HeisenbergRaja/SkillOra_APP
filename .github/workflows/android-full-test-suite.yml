name: Android Full Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skillora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  appium-tests:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          export ANDROID_AVD_HOME="$HOME/.config/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "=== ANDROID ENVIRONMENT ==="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "HOME=$HOME"
      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "cmdline-tools;latest" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - name: Create AVD
        run: |
          export ANDROID_AVD_HOME="$HOME/.config/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd --name skillora-test --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          echo "=== ANDROID_AVD_HOME ==="
          echo "$ANDROID_AVD_HOME"
          echo "=== EMULATOR LIST ==="
          emulator -list-avds
          echo "=== AVD DIRECTORY ==="
          ls -la "$ANDROID_AVD_HOME"
          test -d "$ANDROID_AVD_HOME/skillora-test.avd" || exit 1
      - name: Install Linux Emulator Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpulse0 \
            libglu1-mesa \
            libnss3 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libxtst6 \
            libdbus-1-3 \
            libfontconfig1 \
            libgcc-s1 \
            libglib2.0-0 \
            libstdc++6
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
      - name: Make Scripts Executable
        run: |
          chmod +x scripts/check-android-emulator-dependencies.sh
          chmod +x scripts/wait-for-android-emulator.sh
      - name: Run Pre-flight Check
        run: bash scripts/check-android-emulator-dependencies.sh
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: skillora-debug-apk
          path: ./appium-tests/app
      - name: Install Appium Dependencies
        working-directory: ./appium-tests
        run: npm ci
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Wait for Emulator and Run Tests
        run: bash scripts/wait-for-android-emulator.sh
      - name: Generate Test Reports
        if: always()
        working-directory: ./appium-tests
        run: node scripts/generate-appium-report.js
      - name: Upload Appium Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results
          path: |
            ./appium-tests/reports/
      - name: Publish GitHub Summary
        if: always()
        run: |
          if [ -f ./appium-tests/reports/appium-test-report.md ]; then
            cat ./appium-tests/reports/appium-test-report.md >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Emulator Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: android-emulator-diagnostics/

  load-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          version: 'latest'
      - name: Verify k6 Installation
        run: |
          k6 version
          echo 'import http from "k6/http"; export default function() { http.get("http://localhost"); }' > minimal_test.js
          k6 run --iterations 1 minimal_test.js || echo "Minimal test completed"
      - name: Validate load test configuration
        run: |
          echo "=== LOAD TEST PRE-FLIGHT ==="
          test -n "$API_BASE_URL" || { echo "ERROR: API_BASE_URL GitHub secret is missing"; exit 1; }
          test -n "$FIREBASE_API_KEY" || { echo "ERROR: FIREBASE_API_KEY GitHub secret is missing"; exit 1; }
          echo "API_BASE_URL: configured"
          echo "Firebase authentication: configured"
          echo "Test authentication: configured"
          echo "k6: PASS"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || 'https://firestore.googleapis.com/v1/projects/skillora-e2114/databases/(default)/documents' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_TEST_EMAIL: ${{ secrets.FIREBASE_TEST_EMAIL }}
          FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
      - name: Verify Backend (Health Check)
        run: |
          echo "=== WAITING FOR APPLICATION ==="
          timeout 120 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' ${API_BASE_URL})" == "000" ]]; do sleep 5; done' || (echo "Backend unreachable" && exit 1)
          echo "Application is reachable at ${API_BASE_URL}"
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || 'https://firestore.googleapis.com/v1/projects/skillora-e2114/databases/(default)/documents' }}
      - name: Minimal Authentication Test (1 VU)
        working-directory: ./load-tests
        run: |
          echo "=== API SMOKE TEST ==="
          k6 run --vus 1 --iterations 1 scenarios/api-load-tests.js
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || 'https://firestore.googleapis.com/v1/projects/skillora-e2114/databases/(default)/documents' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_TEST_EMAIL: ${{ secrets.FIREBASE_TEST_EMAIL }}
          FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
      - name: Run k6 Load Tests
        working-directory: ./load-tests
        continue-on-error: true
        run: |
          echo "=== LOAD TEST ==="
          k6 run scenarios/api-load-tests.js
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL != '' && secrets.API_BASE_URL || 'https://firestore.googleapis.com/v1/projects/skillora-e2114/databases/(default)/documents' }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_TEST_EMAIL: ${{ secrets.FIREBASE_TEST_EMAIL }}
          FIREBASE_TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
      - name: Upload Load Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: ./load-tests/reports/

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Security Scans
        working-directory: ./security-tests
        run: chmod +x run-security-scans.sh && ./run-security-scans.sh
      - name: Upload Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: ./security-tests/*-results.json

  final-test-suite-summary:
    needs: [appium-tests, load-tests, security-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install exceljs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate Final Report
        run: node scripts/generate-final-report.js
      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-test-suite-report
          path: final-test-suite-report.xlsx
