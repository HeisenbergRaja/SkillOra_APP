name: Android Full Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skillora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  appium-tests:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Android SDK Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "emulator" "cmdline-tools;latest" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd --name skillora-test --package "system-images;android-35;google_apis;x86_64" --device "pixel_2"
          avdmanager list avd | grep skillora-test || (echo "AVD creation failed" && exit 1)
      - name: Verify Emulator Executable
        run: |
          which adb
          which emulator
          which sdkmanager
          which avdmanager
          ls -la "$ANDROID_SDK_ROOT/emulator/emulator"
          emulator -version
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: skillora-debug-apk
          path: ./appium-tests/app
      - name: Start Emulator
        run: |
          emulator -list-avds
          emulator -avd skillora-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
      - name: Install Appium Dependencies
        working-directory: ./appium-tests
        run: npm install
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Make Script Executable
        run: chmod +x scripts/wait-for-android-emulator.sh
      - name: Wait for Emulator and Run Tests
        run: bash scripts/wait-for-android-emulator.sh
      - name: Upload Appium Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results
          path: |
            ./appium-tests/reports/appium-test-results.xlsx
            ./appium-tests/reports/appium-test-results.json
            ./appium-tests/reports/appium-screenshots/
            ./appium-tests/reports/appium-logs/
      - name: Upload Emulator Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: android-emulator-diagnostics/

  load-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        run: sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 && echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list && sudo apt-get update && sudo apt-get install k6
      - name: Run k6 Load Tests
        working-directory: ./load-tests
        continue-on-error: true
        run: k6 run scenarios/api-load-tests.js
        env:
          API_URL: ${{ secrets.API_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Upload Load Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: ./load-tests/reports/

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Security Scans
        working-directory: ./security-tests
        run: chmod +x run-security-scans.sh && ./run-security-scans.sh
      - name: Upload Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: ./security-tests/*-results.json

  final-test-suite-summary:
    needs: [appium-tests, load-tests, security-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install exceljs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate Final Report
        run: node scripts/generate-final-report.js
      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-test-suite-report
          path: final-test-suite-report.xlsx
