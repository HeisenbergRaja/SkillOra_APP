name: Android Full Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skillora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  appium-tests:
    needs: android-build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 34]
        target: [google_apis]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Appium Dependencies
        working-directory: ./appium-tests
        run: npm install
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: skillora-debug-apk
          path: ./appium-tests/app
      - name: Start Appium Server
        run: npx appium &
      - name: Run Appium Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: arm64-v8a
          script: cd appium-tests && npm run wdio
      - name: Upload Appium Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results
          path: ./appium-tests/reports/

  load-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        run: sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69 && echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list && sudo apt-get update && sudo apt-get install k6
      - name: Run k6 Load Tests
        working-directory: ./load-tests
        continue-on-error: true
        run: k6 run scenarios/api-load-tests.js
        env:
          API_URL: ${{ secrets.API_URL }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Upload Load Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: ./load-tests/reports/

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Security Scans
        working-directory: ./security-tests
        run: chmod +x run-security-scans.sh && ./run-security-scans.sh
      - name: Upload Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-test-results
          path: ./security-tests/*-results.json

  final-test-suite-summary:
    needs: [appium-tests, load-tests, security-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install exceljs
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate Final Report
        run: node scripts/generate-final-report.js
      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-test-suite-report
          path: final-test-suite-report.xlsx
